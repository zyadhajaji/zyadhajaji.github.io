<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Image gallery</title>
  
  <style>
    body {
      font-family: sans-serif;
      width: 640px;
      margin: 0 auto;
      background-color: lightgray;
    }
    h1 {
      text-align: center;
    }
    .full-img {
      position: relative;
      display: block;
      width: 640px;
      height: 480px;
      margin-bottom: 2px;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
    }
    button {
      background: rgb(150 150 150 / 0.6);
      border: 1px solid #999999;
      position: absolute;
      cursor: pointer;
      top: 2px;
      left: 2px;
    }
    button:hover,
    button:focus {
      color: rgb(150 150 150 / 1);
      background-color: black;
    }
    .thumb-bar {
      display: flex;
      gap: 2px;
      cursor: pointer;
    }
    .thumb-bar img {
      display: block;
      width: 100px;
      flex: 1;
    }
    .thumb-bar img:hover,
    .thumb-bar img:focus {
      outline: 2px solid blue;
    }
  </style>
</head>

<body>
  <h1>Image gallery example</h1>
  <div class="full-img">
    <img
      class="displayed-img"
      src="https://mdn.github.io/shared-assets/images/examples/learn/gallery/pic1.jpg"
      alt="Closeup of a human eye" />
    <div class="overlay"></div>
    <button class="dark">Darken</button>
  </div>
  <div class="thumb-bar"></div>
  <script src="main.js"></script>
</body>
</html>
